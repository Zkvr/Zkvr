<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">Zkvr terminal profile</title>
  <desc id="desc">A terminal-style profile with an ASCII ZKVR logo and current setup.</desc>

  <!--
    HOW TO EDIT
    1. Change the visible values only inside the <text> elements below.
    2. Main colors: blue #58a6ff, green #7ee787, gray #8b949e.
    3. The final <rect> is the blinking cursor; remove its <animate> line to stop it.
  -->

  <rect width="1040" height="360" rx="10" fill="#0d1117"/>
  <rect x="1" y="1" width="1038" height="358" rx="9" fill="none" stroke="#30363d" stroke-width="2"/>

  <g font-family="'Cascadia Mono','Consolas','Courier New',monospace">
    <g fill="#58a6ff" font-size="18" font-weight="700">
      <text x="34" y="64">███████╗██╗  ██╗██╗   ██╗██████╗</text>
      <text x="34" y="91">╚══███╔╝██║ ██╔╝██║   ██║██╔══██╗</text>
      <text x="34" y="118">  ███╔╝ █████╔╝ ██║   ██║██████╔╝</text>
      <text x="34" y="145"> ███╔╝  ██╔═██╗ ╚██╗ ██╔╝██╔══██╗</text>
      <text x="34" y="172">███████╗██║  ██╗ ╚████╔╝ ██║  ██║</text>
      <text x="34" y="199">╚══════╝╚═╝  ╚═╝  ╚═══╝  ╚═╝  ╚═╝</text>
    </g>

    <text x="555" y="54" fill="#7ee787" font-size="20" font-weight="700">zkvr@github</text>
    <text x="555" y="80" fill="#484f58" font-size="15">────────────</text>

    <g font-size="16">
      <text x="555" y="116" fill="#7ee787">PC</text>
      <text x="675" y="116" fill="#8b949e">Windows</text>

      <text x="555" y="148" fill="#7ee787">Printer</text>
      <text x="675" y="148" fill="#8b949e">Creality K1</text>

      <text x="555" y="180" fill="#7ee787">Firmware</text>
      <text x="675" y="180" fill="#8b949e">Klipper + Moonraker</text>

      <text x="555" y="212" fill="#7ee787">Interface</text>
      <text x="675" y="212" fill="#8b949e">Fluidd + Guppy Screen</text>

      <text x="555" y="244" fill="#7ee787">Slicer</text>
      <text x="675" y="244" fill="#8b949e">OrcaSlicer</text>

      <text x="555" y="276" fill="#7ee787">Services</text>
      <text x="675" y="276" fill="#8b949e">Docker + Spoolman</text>

      <text x="555" y="308" fill="#7ee787">Mobile</text>
      <text x="675" y="308" fill="#8b949e">Mobileraker / iOS</text>
    </g>

    <text x="34" y="322" fill="#8b949e" font-size="15">zkvr@workbench:~$</text>
    <rect x="202" y="308" width="8" height="18" fill="#c9d1d9">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
